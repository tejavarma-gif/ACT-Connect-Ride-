<div class="auth-page">
  <div class="auth-bg-glow"></div>

  <div class="auth-card fade-in">
    <div class="auth-brand">
      <div class="logo-mark">A</div>
      <span>ACT ConnectRide</span>
    </div>
    <p class="auth-tagline">Car &amp; Bike pooling for ACT employees</p>

    <div class="auth-toggle">
      <button [class.active]="mode() === 'login'" (click)="switchMode('login')">Sign In</button>
      <button [class.active]="mode() === 'register'" (click)="switchMode('register')">Create Account</button>
    </div>

    @if (mode() === 'register') {
      <div class="form-group fg">
        <label>Full Name</label>
        <div class="input-icon-wrap">
          <i class="fi fa-solid fa-user"></i>
          <input class="form-input" [(ngModel)]="name" placeholder="e.g. Teja Varma" />
        </div>
      </div>
      <div class="form-group fg">
        <label>Phone Number</label>
        <div class="input-icon-wrap">
          <i class="fi fa-solid fa-phone"></i>
          <input class="form-input" type="tel" [(ngModel)]="phone" placeholder="+91 98765 43210" />
        </div>
      </div>
    }

    <div class="form-group fg">
      <label>Work Email</label>
      <div class="input-icon-wrap">
        <i class="fi fa-solid fa-envelope"></i>
        <input class="form-input" type="email" [(ngModel)]="email" placeholder="you@actcorp.in" />
      </div>
    </div>

    <div class="form-group fg">
      <label>Password</label>
      <div class="input-icon-wrap">
        <i class="fi fa-solid fa-lock"></i>
        <input class="form-input" type="password" [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="submit()" />
      </div>
    </div>

    @if (mode() === 'register') {
      <div class="form-group fg">
        <label>City</label>
        <div class="input-icon-wrap">
          <i class="fi fa-solid fa-location-dot"></i>
          <input class="form-input" [(ngModel)]="city" placeholder="Bangalore" />
        </div>
      </div>
    }

    <button class="auth-btn" (click)="submit()" [disabled]="loading()">
      @if (loading()) {
        <i class="fa-solid fa-circle-notch fa-spin"></i> Please wait…
      } @else {
        {{ mode() === 'login' ? 'Sign In' : 'Create Account' }}
        <i class="fa-solid fa-arrow-right"></i>
      }
    </button>

    <div class="demo-hint" (click)="fillDemo()">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      Use demo account (teja&#64;actcorp.in / password123)
    </div>
  </div>
</div>
